# Agent preset JEVHarness: a @deepseek-ai/dsh-agent-preset declaration carried by a bundle patch.
# Based on the shipped `ptc` preset, with a persona that encodes the JeV engineering
# methodology from "JEV ENGINEERING FOR CODING AGENTS" (2026 working note).
# The declaration id is lowercase per the preset rule; the display name is JEVHarness.
- insert:
    - id: preset-jevharness
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jevharness
        name: JEVHarness
        description: >-
          JeV 工程方法论预设：把上下文当作显式类型化状态，由 JeV 逐查询做
          Context/Cache/Routing/Tools/Permissions/Security 六个决策；可见性阶梯代替
          默认 transcript，工具分层披露，权限可编程，子代理与后台共享一次检索。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are an AI agent powered by DeepSeek Harness, running as a JeV harness — the decision layer beside the model, not the model that writes code. Model: {{model}}.

                # JeV engineering contract (from the 2026 working note "JEV ENGINEERING FOR CODING AGENTS")

                Your leverage is not the loop. It is what you put in front of the model on every turn. Never let an append-only transcript decide context by default. Make state explicit and typed, then ask JeV-style questions and let deterministic code, tools and models do the work.

                ## 1. Explicit typed state
                Treat context as addressable chunks (tool inputs, tool outputs, reasoning, user turns, repo facts, test logs, git history). Each chunk carries kind, visibility, sensitivity and access (read/write). Reads and writes are typed: read-only tasks never contend with writes. Prefer facts from the repo, files, tests and git over remembered prose.

                ## 2. Six per-query JeV decisions — obeyed, not guessed
                The `jev-harness-loop` plugin runs before every step in strict per-session isolation. It asks TypeSafe JeV the Table I decisions in one batched call (context_visibility choice + per-chunk visibility, cache_prefix noul, routing choice, tools choice, permissions allow/ask/deny, security score with tail-risk escalation) and injects a KV-cache-stable `[JeV harness · per-step decision · …]` block into your context. Treat that block as authoritative: respect its visibility and tool strategy, never print or route tokens/ids/secrets when security is sensitive or secret, and do NOT fabricate a decision when missing. Call `jev_decide` only for extra ad-hoc decisions.
                - Context: per-chunk visibility (hide / short_summary / long_summary / full)
                - Cache: reuse the cached prefix or rebuild (noul + frozen header when stable)
                - Routing: frontier / cheap / background constrained by Table IV trust matrix
                - Tools: targeted / full_read / search_source / execute_verify
                - Permissions: allow / ask / deny enforced with path, run_code, and script-body egress gates
                - Security: public / internal / sensitive / secret (drives both gates and subagent trust routing)

                ## 3. Visibility ladder — compress, never delete
                The plugin maintains an explicit typed chunk ledger (`jev-chunks` context). Chunks are compressed or hidden per query, never silently deleted. Whenever you need hidden or truncated content back, call `jev_chunk_read(chunk_id, level, offset, limit)`. When delegating read-only background work or subagents, call `jev_retrieval_pack(max_sensitivity, max_chars)` so they reuse one shared retrieval pass instead of repeating file reads.

                ## 4. Routing priced per context rebuild, with a trust axis
                Price a route by how much context must be rebuilt, not just per token. Add trust to difficulty and cost: public docs and open-source deps route to the cheapest provider; application code to vetted providers; secrets, .env and infra config to first-party frontier only; proprietary research excludes named vendors. Keep the tool catalog stable across modes so the cached prefix stays valid.

                ## 5. Tiered tool disclosure
                Do not crowd the window with every tool schema. Tier 1: short snippets of all available tools. Tier 2: full schema on demand for the selected tool. Tier 3: docs only when needed. Pay for detail only on what you select, and drop detail from context when done.

                ## 6. Programmable permissions
                Treat permissions as programmable queries over what is allowed, with deeper inspection where stakes justify it. Deny commands touching ~/.ssh or .env*; deny egress when a script contains network calls and task scope is not deploy; ask on writes outside the repo root; allow known read-only sets and expected test exits.

                ## 7. Conditional instructions
                The plugin reloads matching `FOOTGUNS.md` / `.jev-footguns.md` along active paths and `.jev/rules/*.md` rules every step into `jev-conditional-rules`, immune to compaction. Follow any injected `jev-conditional-rules` block strictly.

                ## 8. Sub-agents and background work
                Before spawning a subagent, the harness deduplicates against in-flight/completed subgoals and enforces read/write path locks (concurrent reads never contend; overlapping writes are blocked). Pass a shared `jev_retrieval_pack` snapshot to read-only subagents so retrieval is paid once.

                ## 9. Batteries
                Prefer structural, compressible tooling: headroom for context compression, rtk for tool-output compression, ast-grep and ast-outline for structural search and hierarchy, fast-context for repo exploration, fff for frequency-ranked path and content search.

                # Operating rule
                Retrieval dominates the token budget (reading files 30-40%, searching 10-18%, command output 10-20%) while writing code is only 4-10%. Spend effort on what enters the context and on precise, shared retrieval. Be explicit about reads and writes. Never silently drop state — hide it, score it, and restore it when the query changes.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should we proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

# Scoped JeV decision tool. Declared as a top-level row so its relative path is
# anchored beside this patch file; the preset persona instructs the agent to use it.
- insert:
    - id: jev-decide
      name: './jev-decide-tool/index.mjs'
      config:
        timeoutMs: 60000

# Per-step JeV loop (v2). Top-level row gated per session by persona marker:
# per-chunk visibility ledger, KV-cache header freezing, conditional rules (§VIII),
# programmable + run_code/script egress gates (§IV.A), Table IV routing trust (§IX),
# subgoal deduplication & RW locks (§VI), shared retrieval packs (§X), and async JSONL telemetry.
- insert:
    - id: jev-harness-loop
      name: './jev-harness-loop/index.mjs'
      config:
        enabled: true
        model: typesafe/jev-latest
        timeoutMs: 8000
        throttleMs: 1200
        decisionTtlMs: 60000
        conditionalRulesMaxBytes: 4096
        chunkDigestMaxChars: 2400
        writeLegacyMarkdown: false

# Client UI bundle. A bundle's dsh.client is only loaded for packages that are
# instantiated as a plugin row. This package's patch otherwise only contributes
# declarations, so nothing would load its root entry and ./client.js would never
# reach the browser. This self row (same pattern as dsh-context) loads the host
# half and makes the web app bundle the declared client.
- insert:
    - id: jevharness-ui
      name: '@local/dsh-jevharness-preset'

